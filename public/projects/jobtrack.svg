<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="jtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e1f" />
      <stop offset="50%" stop-color="#0c1a36" />
      <stop offset="100%" stop-color="#030814" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="jtFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#jtBg)" />
  <circle cx="720" cy="90" r="150" fill="#3B82F6" opacity="0.12" filter="url(#jtFilter)" />
  <circle cx="90" cy="360" r="130" fill="#0284C7" opacity="0.09" filter="url(#jtFilter)" />

  <!-- Window Frame -->
  <rect x="40" y="35" width="720" height="380" rx="16" fill="#0d1b33" stroke="#1e3a6a" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="40" y="35" width="720" height="48" rx="16" fill="#142647" />
  <circle cx="68" cy="59" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="88" cy="59" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="108" cy="59" r="6" fill="#10B981" opacity="0.8" />
  <text x="140" y="64" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">JobTrack · Job Application Pipeline</text>
  <rect x="580" y="47" width="160" height="24" rx="12" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1" />
  <text x="595" y="63" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PostgreSQL + Prisma</text>

  <!-- Filter Bar -->
  <rect x="65" y="100" width="670" height="40" rx="8" fill="#102344" />
  <text x="85" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">🔍 Search applications, roles, companies...</text>
  <rect x="540" y="108" width="80" height="24" rx="6" fill="#1e3a6a" />
  <text x="555" y="124" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">Filter: All</text>
  <rect x="630" y="108" width="90" height="24" rx="6" fill="#2563eb" />
  <text x="643" y="124" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5">+ New Job</text>

  <!-- Column 1: Applied (3 cards) -->
  <rect x="65" y="155" width="210" height="235" rx="10" fill="#0b162b" stroke="#193159" stroke-width="1" />
  <rect x="75" y="167" width="8" height="8" rx="2" fill="#60a5fa" />
  <text x="92" y="175" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">APPLIED (4)</text>
  
  <rect x="75" y="190" width="190" height="60" rx="8" fill="#13233f" stroke="#1d3866" stroke-width="1" />
  <text x="88" y="210" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Software Engineer</text>
  <text x="88" y="226" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Google · Bengaluru · Full Time</text>
  <rect x="88" y="233" width="55" height="12" rx="3" fill="#3b82f6" fill-opacity="0.2" />
  <text x="92" y="242" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="8.5">Applied 2d</text>

  <rect x="75" y="260" width="190" height="60" rx="8" fill="#13233f" stroke="#1d3866" stroke-width="1" />
  <text x="88" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Frontend Developer</text>
  <text x="88" y="296" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Razorpay · Remote · React</text>
  <rect x="88" y="303" width="55" height="12" rx="3" fill="#3b82f6" fill-opacity="0.2" />
  <text x="92" y="312" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="8.5">Applied 4d</text>

  <!-- Column 2: Interviewing (2 cards) -->
  <rect x="295" y="155" width="210" height="235" rx="10" fill="#0b162b" stroke="#193159" stroke-width="1" />
  <rect x="305" y="167" width="8" height="8" rx="2" fill="#f59e0b" />
  <text x="322" y="175" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">INTERVIEWING (2)</text>
  
  <rect x="305" y="190" width="190" height="68" rx="8" fill="#172b4d" stroke="#25477d" stroke-width="1" />
  <text x="318" y="210" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">SDE - 1 (Full Stack)</text>
  <text x="318" y="226" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Atlassian · Pune / Hybrid</text>
  <text x="318" y="244" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9.5">Round 2: Tech DSA · Tomorrow</text>

  <rect x="305" y="268" width="190" height="68" rx="8" fill="#172b4d" stroke="#25477d" stroke-width="1" />
  <text x="318" y="288" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">React Engineer</text>
  <text x="318" y="304" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Zomato · Gurugram</text>
  <text x="318" y="322" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9.5">Round 1: System Design Passed</text>

  <!-- Column 3: Offers & Stats -->
  <rect x="525" y="155" width="210" height="235" rx="10" fill="#0b162b" stroke="#193159" stroke-width="1" />
  <rect x="535" y="167" width="8" height="8" rx="2" fill="#10b981" />
  <text x="552" y="175" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">OFFERS &amp; ANALYTICS</text>
  
  <rect x="535" y="190" width="190" height="75" rx="8" fill="#122a27" stroke="#1c4f42" stroke-width="1" />
  <text x="548" y="210" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🎉 Offer Received</text>
  <text x="548" y="228" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Software Development Engineer</text>
  <text x="548" y="244" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Pune, India · CTC Validated</text>

  <rect x="535" y="275" width="190" height="100" rx="8" fill="#13233f" />
  <text x="548" y="297" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">METRICS SUMMARY</text>
  <text x="548" y="322" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">18 Total · 33% Response</text>
  <text x="548" y="342" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10">JWT Protected Session</text>
  <text x="548" y="358" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">PostgreSQL Relational DB</text>
</svg>

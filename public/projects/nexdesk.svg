<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ndBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="ndGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#ndBg)" />
  <circle cx="700" cy="80" r="160" fill="#2563EB" opacity="0.14" filter="url(#ndGlow)" />
  <circle cx="100" cy="380" r="130" fill="#0284C7" opacity="0.09" filter="url(#ndGlow)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Main App Frame -->
  <rect x="40" y="35" width="720" height="380" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="40" y="35" width="720" height="48" rx="16" fill="#0f172a" />
  <circle cx="68" cy="59" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="88" cy="59" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="108" cy="59" r="6" fill="#10B981" opacity="0.8" />
  <text x="140" y="64" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="bold" letter-spacing="0.5">NEXDESK · Enterprise IT Service Desk &amp; Incident Management</text>
  <rect x="540" y="47" width="200" height="24" rx="12" fill="#2563eb" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" />
  <text x="555" y="63" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🛡️ 4-Tier RBAC &amp; SLA Engine</text>

  <!-- Left Column: Active Incidents & SLA State Machine -->
  <rect x="65" y="100" width="350" height="290" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1" />
  
  <g transform="translate(85, 120)">
    <text x="0" y="10" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">INCIDENT QUEUE &amp; SLA MONITOR</text>
    
    <!-- Ticket 1: Critical P1 -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="310" height="92" rx="8" fill="#0f172a" stroke="#dc2626" stroke-width="1" />
      <rect x="12" y="10" width="68" height="18" rx="4" fill="#ef4444" fill-opacity="0.2" />
      <text x="18" y="23" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">P1 CRITICAL</text>
      
      <rect x="85" y="10" width="60" height="18" rx="4" fill="#1e293b" />
      <text x="91" y="23" fill="#94a3b8" font-family="monospace" font-size="9">INC-1001</text>

      <rect x="235" y="10" width="65" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2" />
      <text x="242" y="23" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9" font-weight="600">TRIAGED</text>

      <text x="12" y="48" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">VPN Gateway Timeout on US-West Staging</text>
      <text x="12" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Requester: Elena Rostova · Dept: Engineering</text>
      <text x="12" y="80" fill="#f87171" font-family="monospace" font-size="9">⏱️ SLA Resolution: 1h 45m remaining (Target: 2h)</text>
    </g>

    <!-- Ticket 2: High P2 -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="310" height="92" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <rect x="12" y="10" width="55" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" />
      <text x="18" y="23" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">P2 HIGH</text>
      
      <rect x="72" y="10" width="60" height="18" rx="4" fill="#1e293b" />
      <text x="78" y="23" fill="#94a3b8" font-family="monospace" font-size="9">REQ-1004</text>

      <rect x="220" y="10" width="80" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
      <text x="226" y="23" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" font-weight="600">IN_PROGRESS</text>

      <text x="12" y="48" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">MacBook Pro M3 Hardware Provisioning</text>
      <text x="12" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Assignee: Sarah Jenkins · Asset: AST-1041</text>
      <text x="12" y="80" fill="#34d399" font-family="monospace" font-size="9">⏱️ SLA Response Met · 4h 15m to Resolution</text>
    </g>
  </g>

  <!-- Right Column: Operational Stats, RBAC & Fleet Inventory -->
  <rect x="430" y="100" width="305" height="290" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1" />
  
  <g transform="translate(450, 120)">
    <text x="0" y="10" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">ENTERPRISE ITSM METRICS</text>

    <!-- Stat boxes -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="125" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">99.4%</text>
      <text x="12" y="48" fill="#94a3b8" font-family="monospace" font-size="9">SLA COMPLIANCE</text>

      <rect x="140" y="0" width="125" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">21</text>
      <text x="12" y="48" fill="#94a3b8" font-family="monospace" font-size="9">ENTITIES (PRISMA)</text>
    </g>

    <!-- RBAC 4-Tier Persona Strip -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="265" height="68" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="10" y="20" fill="#94a3b8" font-family="monospace" font-size="9">STRICT SERVER RBAC ENFORCEMENT</text>
      <g transform="translate(10, 32)">
        <rect x="0" y="0" width="55" height="22" rx="4" fill="#ef4444" fill-opacity="0.15" />
        <text x="7" y="15" fill="#fca5a5" font-family="system-ui" font-size="8.5" font-weight="bold">ADMIN</text>

        <rect x="60" y="0" width="58" height="22" rx="4" fill="#a855f7" fill-opacity="0.15" />
        <text x="66" y="15" fill="#d8b4fe" font-family="system-ui" font-size="8.5" font-weight="bold">MANAGER</text>

        <rect x="123" y="0" width="55" height="22" rx="4" fill="#3b82f6" fill-opacity="0.15" />
        <text x="131" y="15" fill="#93c5fd" font-family="system-ui" font-size="8.5" font-weight="bold">AGENT</text>

        <rect x="183" y="0" width="62" height="22" rx="4" fill="#10b981" fill-opacity="0.15" />
        <text x="189" y="15" fill="#6ee7b7" font-family="system-ui" font-size="8.5" font-weight="bold">EMPLOYEE</text>
      </g>
    </g>

    <!-- Audit Ledger & Security Box -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="265" height="42" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">PostgreSQL (Neon) + Vitest &amp; Playwright</text>
      <text x="12" y="32" fill="#94a3b8" font-family="monospace" font-size="8.5">Live Auth · Cookie Sessions · Audit Ledger</text>
    </g>
  </g>
</svg>

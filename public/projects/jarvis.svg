<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#110d24" />
      <stop offset="100%" stop-color="#05030a" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <circle cx="700" cy="80" r="160" fill="#8B5CF6" opacity="0.12" filter="url(#glow)" />
  <circle cx="100" cy="380" r="140" fill="#3B82F6" opacity="0.08" filter="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Main App Window Mockup -->
  <rect x="40" y="35" width="720" height="380" rx="16" fill="#131126" stroke="#2e2554" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="40" y="35" width="720" height="48" rx="16" fill="#1b1735" />
  <circle cx="68" cy="59" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="88" cy="59" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="108" cy="59" r="6" fill="#10B981" opacity="0.8" />
  <text x="140" y="64" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">JARVIS · AI Resume &amp; Job Matcher</text>
  <rect x="620" y="47" width="120" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
  <text x="642" y="63" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">⚡ Live ATS Engine</text>

  <!-- Left Panel: Score & ATS Breakdown -->
  <rect x="65" y="105" width="220" height="285" rx="12" fill="#181433" stroke="#2d2454" stroke-width="1" />
  <text x="85" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">ATS MATCH SCORE</text>
  
  <!-- Circular Score Gauge -->
  <circle cx="175" cy="205" r="50" fill="none" stroke="#251f45" stroke-width="10" />
  <circle cx="175" cy="205" r="50" fill="none" stroke="url(#purpleGlow)" stroke-width="10" stroke-dasharray="314" stroke-dashoffset="35" stroke-linecap="round" transform="rotate(-90 175 205)" />
  <text x="175" y="212" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">92%</text>
  <text x="175" y="230" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">HIGH COMPATIBILITY</text>

  <rect x="85" y="280" width="180" height="6" rx="3" fill="#251f45" />
  <rect x="85" y="280" width="165" height="6" rx="3" fill="url(#purpleGlow)" />
  <text x="85" y="272" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Keywords Match: 94%</text>

  <rect x="85" y="325" width="180" height="6" rx="3" fill="#251f45" />
  <rect x="85" y="325" width="150" height="6" rx="3" fill="url(#greenGlow)" />
  <text x="85" y="317" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Experience Fit: 88%</text>

  <rect x="85" y="370" width="180" height="6" rx="3" fill="#251f45" />
  <rect x="85" y="370" width="160" height="6" rx="3" fill="url(#purpleGlow)" />
  <text x="85" y="362" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Structure &amp; Format: 91%</text>

  <!-- Right Panel: AI Analysis & Insights -->
  <rect x="305" y="105" width="430" height="135" rx="12" fill="#181433" stroke="#2d2454" stroke-width="1" />
  <text x="325" y="132" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🎯 Semantic Skill Matching</text>
  
  <rect x="325" y="148" width="95" height="24" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" />
  <text x="337" y="164" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">✓ React.js (Match)</text>

  <rect x="428" y="148" width="95" height="24" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" />
  <text x="440" y="164" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">✓ REST APIs (Match)</text>

  <rect x="531" y="148" width="95" height="24" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" />
  <text x="543" y="164" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">✓ Node.js (Match)</text>

  <rect x="634" y="148" width="85" height="24" rx="6" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-opacity="0.4" />
  <text x="646" y="164" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11">! GraphQL (Gap)</text>

  <text x="325" y="202" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5" leading="18">
    "Resume exhibits strong alignment with Full-Stack developer specifications. High keyword density in React &amp; Express architectures."
  </text>

  <!-- Right Bottom Panel: Interview Questions Generator -->
  <rect x="305" y="255" width="430" height="135" rx="12" fill="#181433" stroke="#2d2454" stroke-width="1" />
  <text x="325" y="282" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🤖 Tailored Technical Interview Questions</text>
  
  <rect x="325" y="298" width="390" height="34" rx="6" fill="#120e26" />
  <text x="337" y="319" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Q1: How do you optimize React component re-renders when managing real-time data?</text>

  <rect x="325" y="340" width="390" height="34" rx="6" fill="#120e26" />
  <text x="337" y="361" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Q2: Walk through your schema design for PostgreSQL and Prisma ORM indexing.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04121a" />
      <stop offset="50%" stop-color="#082333" />
      <stop offset="100%" stop-color="#020a0f" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="dfFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#dfBg)" />
  <circle cx="700" cy="80" r="160" fill="#06B6D4" opacity="0.12" filter="url(#dfFilter)" />
  <circle cx="120" cy="380" r="140" fill="#3B82F6" opacity="0.08" filter="url(#dfFilter)" />

  <!-- Frame -->
  <rect x="40" y="35" width="720" height="380" rx="16" fill="#0a1d2b" stroke="#133d59" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="40" y="35" width="720" height="48" rx="16" fill="#0e283b" />
  <circle cx="68" cy="59" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="88" cy="59" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="108" cy="59" r="6" fill="#10B981" opacity="0.8" />
  <text x="140" y="64" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">CNN Deepfake Detection Pipeline · OpenCV + TensorFlow</text>
  <rect x="560" y="47" width="180" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
  <text x="575" y="63" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">📜 Published Research</text>

  <!-- Left: Facial Feature Map & Neural Mesh -->
  <rect x="65" y="100" width="310" height="290" rx="12" fill="#0b2336" stroke="#164669" stroke-width="1" />
  <text x="85" y="128" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold">OPENCV FACIAL EXTRACTION</text>

  <!-- Face Wireframe Mockup -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="240" height="220" rx="8" fill="#061926" stroke="#0e3a59" stroke-width="1" />
    
    <!-- Target Bounding Box -->
    <rect x="30" y="20" width="180" height="180" rx="4" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8 4" />
    <path d="M30 35 L30 20 L45 20" fill="none" stroke="#22d3ee" stroke-width="3" />
    <path d="M195 20 L210 20 L210 35" fill="none" stroke="#22d3ee" stroke-width="3" />
    <path d="M30 185 L30 200 L45 200" fill="none" stroke="#22d3ee" stroke-width="3" />
    <path d="M195 200 L210 200 L210 185" fill="none" stroke="#22d3ee" stroke-width="3" />

    <!-- Facial Mesh Lines -->
    <ellipse cx="120" cy="110" rx="55" ry="70" fill="none" stroke="#0e4b75" stroke-width="1" />
    <circle cx="95" cy="95" r="8" fill="none" stroke="#22d3ee" stroke-width="1.5" />
    <circle cx="95" cy="95" r="2" fill="#22d3ee" />
    <circle cx="145" cy="95" r="8" fill="none" stroke="#22d3ee" stroke-width="1.5" />
    <circle cx="145" cy="95" r="2" fill="#22d3ee" />
    
    <path d="M120 95 L120 125 L112 135 L128 135" fill="none" stroke="#06b6d4" stroke-width="1.5" />
    <path d="M100 155 Q120 168 140 155" fill="none" stroke="#22d3ee" stroke-width="1.5" />

    <!-- Detection HUD Tag -->
    <rect x="35" y="25" width="80" height="18" rx="4" fill="#06b6d4" fill-opacity="0.25" />
    <text x="40" y="38" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">FRAME #1482</text>
  </g>

  <!-- Right: Model Metrics & Classification -->
  <rect x="395" y="100" width="340" height="290" rx="12" fill="#0b2336" stroke="#164669" stroke-width="1" />
  <text x="415" y="128" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold">CLASSIFICATION METRICS (CNN)</text>

  <!-- Big 95%+ Box -->
  <rect x="415" y="145" width="300" height="75" rx="8" fill="#0e2f47" stroke="#1e5f8a" stroke-width="1" />
  <text x="430" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="bold">95%+</text>
  <text x="530" y="172" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">ACCURACY REPORTED</text>
  <text x="530" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">High Precision &amp; Recall on CNN Evaluation</text>

  <!-- Research papers mention -->
  <rect x="415" y="230" width="300" height="65" rx="8" fill="#091b29" stroke="#133d59" stroke-width="1" />
  <text x="430" y="252" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Guarding Authenticity: A Deepfake Detection System</text>
  <text x="430" y="268" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="10">Published in IJSREM (IF: 8.448 · DOI: 10.55041/IJSREM34789)</text>
  <text x="430" y="284" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="10">Published in JETIR (IF: 7.95 · Vol. 11 Issue 5)</text>

  <!-- Architecture summary -->
  <rect x="415" y="305" width="300" height="70" rx="8" fill="#0e283b" />
  <text x="430" y="325" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">PIPELINE ARCHITECTURE</text>
  <text x="430" y="342" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="10.5">OpenCV Face Cropping → TensorFlow/Keras CNN</text>
  <text x="430" y="358" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="10.5">Feature Extraction → Binary Softmax Classification</text>
</svg>
